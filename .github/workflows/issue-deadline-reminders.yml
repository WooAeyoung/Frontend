name: Issue deadline reminders

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on approaching issue deadlines
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const today = new Date();
            const koreaToday = new Date(today.toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
            koreaToday.setHours(0, 0, 0, 0);
            const reminderDays = new Set([7, 3, 1]);
            const plannedDeadlines = new Map([
              [1, '2026-10-18'],
              [2, '2026-10-18'],
              [3, '2026-10-18'],
            ]);

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const match = (issue.body || '').match(/(?:^|\n)마감일:\s*(\d{4}-\d{2}-\d{2})(?:\n|$)/);
              const dueDate = match?.[1] || plannedDeadlines.get(issue.number);
              if (!dueDate) continue;

              const due = new Date(`${dueDate}T00:00:00+09:00`);
              const daysLeft = Math.round((due.getTime() - koreaToday.getTime()) / 86400000);
              if (!reminderDays.has(daysLeft)) continue;

              const marker = `<!-- deadline-reminder:${dueDate}:${daysLeft} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              });
              if (comments.some(comment => (comment.body || '').includes(marker))) continue;

              const assignees = (issue.assignees || []).map(user => `@${user.login}`).join(' ');
              const mention = assignees ? `${assignees} ` : '';
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `${marker}\n${mention}⏰ 마감 ${daysLeft}일 전입니다.\n\n- 마감일: **${dueDate}**\n- 남은 기간: **${daysLeft}일**\n\n진행 상황과 남은 작업을 확인해 주세요.`,
              });
            }
